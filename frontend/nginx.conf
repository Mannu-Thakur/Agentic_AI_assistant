server {
    listen 80;
    server_name _;

    # ── SPA root ────────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # Serve pre-compressed assets when the browser supports it
    gzip_static on;

    # ── Proxy API calls to the backend container ────────────────
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;

        # Required for SSE streaming (EventSource / ReadableStream)
        proxy_set_header   Connection          "";
        proxy_set_header   Host                $host;
        proxy_set_header   X-Real-IP           $remote_addr;
        proxy_set_header   X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto   $scheme;

        # Disable buffering so SSE chunks reach the client immediately
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── FastAPI docs pass-through ────────────────────────────────
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── Static assets: aggressive cache ─────────────────────────
    location ~* \.(js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA fallback: always return index.html ───────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Minimal health endpoint (no backend required) ────────────
    location /health {
        access_log  off;
        return 200  "OK\n";
        add_header  Content-Type text/plain;
    }

    # ── Security headers ────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}
