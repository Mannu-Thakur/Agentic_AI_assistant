# ─────────────────────────────────────────────────────────────────────────────
#  Render Deployment Blueprint (render.yaml)
#  Automated deployment infrastructure for Render Cloud Platform
# ─────────────────────────────────────────────────────────────────────────────
services:
  # ── FastAPI Backend Service ───────────────────────────────────────────────
  - type: web
    name: ai-assistant-backend
    runtime: python
    # IMPORTANT: This must match the Render dashboard service runtime.
    # The service was created as native Python (not Docker), so we use python runtime here.
    # Python 3.11 is used to ensure all packages have pre-built wheels (no Rust compiles).
    pythonVersion: "3.11.9"
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1"
    plan: starter
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ai-assistant-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: redis
          name: ai-assistant-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: ai-assistant-redis
          property: port
      - key: SECRET_KEY
        sync: false
        # Run: openssl rand -hex 32  and set this once in the Render dashboard
      - key: FRONTEND_URL
        value: https://ai-assistant-frontend.onrender.com
      - key: BACKEND_CORS_ORIGINS
        value: '["https://ai-assistant-frontend.onrender.com"]'
      - key: GOOGLE_REDIRECT_URI
        value: https://ai-assistant-frontend.onrender.com/auth/google/callback
      - key: GITHUB_REDIRECT_URI
        value: https://ai-assistant-frontend.onrender.com/auth/github/callback
      - key: ALLOWED_REDIRECT_URIS
        value: '["https://ai-assistant-frontend.onrender.com/auth/google/callback","https://ai-assistant-frontend.onrender.com/auth/github/callback"]'
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: SERP_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # Email / SMTP - required for password-reset emails in production
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
  # ── React/Vite Frontend Service ────────────────────────────────────────────
  - type: web
    name: ai-assistant-frontend
    runtime: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: VITE_API_BASE_URL
        value: https://ai-assistant-backend.onrender.com

  # ── Redis Cache Service ───────────────────────────────────────────────────
  - type: redis
    name: ai-assistant-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

# ── Managed PostgreSQL Database ──────────────────────────────────────────────
databases:
  - name: ai-assistant-db
    databaseName: ai_workspace_db
    user: ai_user
    plan: starter
