# ─────────────────────────────────────────────────────────────────────────────
#  Render Deployment Blueprint (render.yaml)
#  Backend → Render | Frontend → Vercel (removed from here)
# ─────────────────────────────────────────────────────────────────────────────
services:
  # ── FastAPI Backend Service ───────────────────────────────────────────────
  - type: web
    name: ai-assistant-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    # Standard plan required: torch + easyocr + sentence-transformers need ≥2 GB RAM
    plan: standard
    healthCheckPath: /api/v1/health
    # preDeployCommand runs BEFORE traffic switches → zero-downtime DB migrations
    preDeployCommand: "alembic upgrade head"
    envVars:
      - key: ENVIRONMENT
        value: production
      # ── Database ───────────────────────────────────────────────────────────
      - key: DATABASE_URL
        fromDatabase:
          name: ai-assistant-db
          property: connectionString
      # ── Redis ──────────────────────────────────────────────────────────────
      - key: REDIS_HOST
        fromService:
          type: redis
          name: ai-assistant-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: ai-assistant-redis
          property: port
      # ── Security ───────────────────────────────────────────────────────────
      - key: SECRET_KEY
        generateValue: true
      # ── CORS & OAuth redirect URIs ─────────────────────────────────────────
      # IMPORTANT: Replace YOUR_VERCEL_URL with your actual Vercel deployment URL
      # e.g. https://your-app.vercel.app  or your custom domain
      - key: FRONTEND_URL
        value: https://YOUR_VERCEL_URL
      - key: BACKEND_CORS_ORIGINS
        value: '["https://YOUR_VERCEL_URL"]'
      - key: GOOGLE_REDIRECT_URI
        value: https://YOUR_VERCEL_URL/auth/google/callback
      - key: GITHUB_REDIRECT_URI
        value: https://YOUR_VERCEL_URL/auth/github/callback
      - key: ALLOWED_REDIRECT_URIS
        value: '["https://YOUR_VERCEL_URL/auth/google/callback","https://YOUR_VERCEL_URL/auth/github/callback"]'
      # ── LLM API keys (set in Render dashboard — never commit) ──────────────
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # ── Search API keys ────────────────────────────────────────────────────
      - key: TAVILY_API_KEY
        sync: false
      - key: SERP_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false
      # ── OAuth credentials (set in Render dashboard) ────────────────────────
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false

  # ── Redis Cache Service ───────────────────────────────────────────────────
  - type: redis
    name: ai-assistant-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

# ── Managed PostgreSQL Database ──────────────────────────────────────────────
databases:
  - name: ai-assistant-db
    databaseName: ai_workspace_db
    user: ai_user
    plan: starter
