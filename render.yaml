# ─────────────────────────────────────────────────────────────────────────────
#  Render Deployment Blueprint (render.yaml)
#  Automated deployment infrastructure for Render Cloud Platform
# ─────────────────────────────────────────────────────────────────────────────
services:
  # ── FastAPI Backend Service ───────────────────────────────────────────────
  - type: web
    name: ai-assistant-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: starter
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ai-assistant-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: redis
          name: ai-assistant-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: ai-assistant-redis
          property: port
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: SERP_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: BACKEND_CORS_ORIGINS
        value: '["*"]'

  # ── React/Vite Frontend Service ────────────────────────────────────────────
  - type: web
    name: ai-assistant-frontend
    runtime: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: ai-assistant-backend
          property: host

  # ── Redis Cache Service ───────────────────────────────────────────────────
  - type: redis
    name: ai-assistant-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

# ── Managed PostgreSQL Database ──────────────────────────────────────────────
databases:
  - name: ai-assistant-db
    databaseName: ai_workspace_db
    user: ai_user
    plan: starter
